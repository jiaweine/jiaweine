name: Build Profile UI

on:
  push:
    paths:
      - 'tools/ProfileUiGenerator.java'
      - 'tools/ThreeDResumeGenerator.java'
      - '.github/workflows/build-profile-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Render profile assets
        run: |
          javac tools/ProfileUiGenerator.java tools/ThreeDResumeGenerator.java
          java -Djava.awt.headless=true -cp tools ProfileUiGenerator
          java -Djava.awt.headless=true -cp tools ThreeDResumeGenerator

      - name: Validate animated GIF
        run: |
          file assets/hero-java.gif
          jshell <<'EOF'
          import javax.imageio.*;
          import java.io.*;
          var input = ImageIO.createImageInputStream(new File("assets/hero-java.gif"));
          var reader = ImageIO.getImageReaders(input).next();
          reader.setInput(input);
          var frames = reader.getNumImages(true);
          var w = reader.getWidth(0);
          var h = reader.getHeight(0);
          System.out.println("validated GIF: " + frames + " frames, " + w + "x" + h);
          if (frames < 2 || w < 800 || h < 300) throw new RuntimeException("Invalid profile GIF");
          /exit
          EOF

      - name: Validate 3D resume page
        run: |
          test -s docs/index.html
          grep -q 'Jiawei Wang' docs/index.html
          grep -q 'Harness Engineering' docs/index.html
          echo 'validated docs/index.html'

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-java.gif assets/section-rule.svg docs/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Render Java profile UI assets'
          git push
