name: Build Profile UI

on:
  push:
    paths:
      - 'tools/ProfileUiGenerator.java'
      - '.github/workflows/build-profile-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Render profile UI
        run: |
          javac tools/ProfileUiGenerator.java
          java -Djava.awt.headless=true -cp tools ProfileUiGenerator

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-java.gif assets/section-rule.svg
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Render Java profile UI assets'
          git push
