  <g font-family="Trebuchet MS, Avenir Next, ui-rounded, system-ui, sans-serif">
    <text x="72" y="78" fill="#474248" font-size="26" font-weight="760">Models are only one part of the system.</text>
    <text x="72" y="111" fill="#7B7378" font-size="17" font-weight="600">I care about what happens before training, after inference, and everywhere in between.</text>

