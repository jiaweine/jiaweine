      <text x="544" y="174" fill="#6B5879">Agent Post-Training</text>

      <rect x="740" y="150" width="207" height="38" rx="19" fill="#EAF5EC" stroke="#C9E1CE"/>
      <text x="760" y="174" fill="#52715A">Harness Engineering</text>
