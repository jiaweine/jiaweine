<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Jiawei Wang profile banner</title>
  <desc id="desc">Algorithm Research, AI Systems, Full-Stack Engineering. Multimodal AI, Search Ads and Recommendation, Agent Post-Training, Harness Engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="62%" stop-color="#0f1722"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(1010 40) rotate(145) scale(420 230)">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientTransform="translate(80 310) rotate(-28) scale(440 190)">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#bg)" stroke="#243041"/>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#violet)"/>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#cyan)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="68" y="82" fill="#f8fafc" font-size="43" font-weight="760" letter-spacing="1.2">JIAWEI WANG</text>
    <text x="70" y="120" fill="#aeb9c8" font-size="18" font-weight="560" letter-spacing="0.7">ALGORITHM RESEARCH · AI SYSTEMS · FULL-STACK ENGINEERING</text>

    <line x1="70" y1="150" x2="844" y2="150" stroke="#2d3a4d" stroke-width="1"/>

    <g font-size="16" font-weight="590">
      <rect x="70" y="178" width="164" height="34" rx="17" fill="#172033" stroke="#2b3950"/>
      <text x="88" y="200" fill="#dce4ef">Multimodal AI</text>

      <rect x="247" y="178" width="282" height="34" rx="17" fill="#172033" stroke="#2b3950"/>
      <text x="265" y="200" fill="#dce4ef">Search, Ads &amp; Recommendation</text>

      <rect x="542" y="178" width="208" height="34" rx="17" fill="#172033" stroke="#2b3950"/>
      <text x="560" y="200" fill="#dce4ef">Agent Post-Training</text>

      <rect x="763" y="178" width="202" height="34" rx="17" fill="#172033" stroke="#2b3950"/>
      <text x="781" y="200" fill="#dce4ef">Harness Engineering</text>
    </g>

    <text x="70" y="252" fill="#7f8da3" font-size="15" font-weight="500">Research deeply. Build carefully. Ship things that work.</text>

    <circle cx="1064" cy="146" r="76" fill="#111a28" stroke="#334155"/>
    <circle cx="1064" cy="146" r="60" fill="none" stroke="#253348"/>
    <text x="1064" y="158" text-anchor="middle" fill="#e8edf5" font-size="38" font-weight="720" letter-spacing="2">JW</text>
  </g>
</svg>