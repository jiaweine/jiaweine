    <text x="357" y="268" text-anchor="middle" fill="#A5F3FC">Search · Ads · RecSys</text>

    <rect x="480" y="246" width="186" height="34" rx="17" fill="#4F46E5" fill-opacity="0.13" stroke="#818CF8" stroke-opacity="0.55"/>
