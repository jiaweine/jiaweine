  <text x="74" y="137" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="560" letter-spacing="0.8">ALGORITHM RESEARCH · AI SYSTEMS · FULL-STACK ENGINEERING</text>

