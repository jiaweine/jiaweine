<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Jiawei Wang profile illustration</title>
  <desc id="desc">A light editorial cartoon illustration for multimodal AI, search ads and recommendation, agent post-training, and harness engineering.</desc>

