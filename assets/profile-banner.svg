<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="50" x2="1000" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(230 80) rotate(35) scale(360 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(965 270) rotate(-150) scale(360 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blurred"/>
      <feMerge><feMergeNode in="blurred"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#glow1)"/>
  <rect width="1200" height="360" rx="26" fill="url(#glow2)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>

  <rect x="34" y="30" width="1132" height="300" rx="22" stroke="url(#accent)" stroke-opacity="0.35"/>

  <circle cx="978" cy="103" r="84" stroke="#22D3EE" stroke-opacity="0.28"/>
  <circle cx="978" cy="103" r="56" stroke="#A3E635" stroke-opacity="0.20"/>
  <circle cx="978" cy="103" r="18" fill="#22D3EE" fill-opacity="0.16" filter="url(#blur)"/>
  <circle cx="978" cy="103" r="6" fill="#A3E635" filter="url(#soft)"/>

  <path d="M875 230C925 195 1010 198 1084 242" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.48"/>
  <path d="M878 257C944 225 1020 231 1090 281" stroke="#22D3EE" stroke-opacity="0.22"/>
  <circle cx="905" cy="216" r="5" fill="#7C3AED"/>
  <circle cx="1017" cy="215" r="5" fill="#22D3EE"/>
  <circle cx="1080" cy="241" r="5" fill="#A3E635"/>

  <rect x="84" y="76" width="118" height="30" rx="15" fill="#111827" stroke="#22D3EE" stroke-opacity="0.55"/>
  <text x="143" y="96" text-anchor="middle" fill="#67E8F9" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="1.5">JIAWEINE</text>

  <text x="82" y="161" fill="#F8FAFC" font-size="52" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Jiawei Wang</text>
  <text x="84" y="204" fill="#CBD5E1" font-size="22" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Algorithm Research · AI Systems · Full-Stack Engineering</text>

