<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050713"/>
      <stop offset="0.48" stop-color="#0A1024"/>
      <stop offset="1" stop-color="#07111A"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="50" x2="1080" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#8B5CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.48" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#A3E635;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#A3E635">
        <animate attributeName="stop-color" values="#A3E635;#8B5CF6;#A3E635" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(210 72) rotate(35) scale(360 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(1040 318) rotate(-150) scale(410 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.065"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#violetGlow)"/>
  <rect width="1200" height="420" rx="28" fill="url(#cyanGlow)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <rect x="30" y="28" width="1140" height="364" rx="24" stroke="url(#accent)" stroke-opacity="0.42"/>
  <rect x="-360" y="28" width="300" height="364" fill="url(#scan)" opacity="0.8">
    <animate attributeName="x" values="-360;1260" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.9">
    <circle cx="1012" cy="108" r="92" stroke="#22D3EE" stroke-opacity="0.20"/>
    <circle cx="1012" cy="108" r="62" stroke="#A3E635" stroke-opacity="0.16"/>
    <circle cx="1012" cy="108" r="30" stroke="#8B5CF6" stroke-opacity="0.22"/>
    <circle cx="1012" cy="108" r="5" fill="#A3E635">
      <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1012" cy="108" r="22" fill="#22D3EE" opacity="0.08" filter="url(#softGlow)"/>
  </g>

  <g stroke-linecap="round">
    <path d="M860 248C905 220 946 217 985 235C1027 254 1062 252 1118 220" stroke="url(#accent)" stroke-width="2.2" stroke-opacity="0.64"/>
    <path d="M860 276C906 250 951 248 994 269C1039 291 1078 284 1124 250" stroke="#22D3EE" stroke-opacity="0.22"/>
    <circle cx="889" cy="233" r="4.5" fill="#8B5CF6"/>
    <circle cx="984" cy="235" r="4.5" fill="#22D3EE"/>
    <circle cx="1087" cy="235" r="4.5" fill="#A3E635"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="78" y="62" width="154" height="34" rx="17" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.48"/>
    <circle cx="98" cy="79" r="4" fill="#A3E635">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="165" y="84" text-anchor="middle" fill="#A5F3FC" font-size="12.5" letter-spacing="1.7">JIAWEINE / ACTIVE</text>
  </g>

  <text x="78" y="170" fill="#F8FAFC" font-size="58" font-weight="750" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Jiawei Wang</text>
  <text x="80" y="216" fill="#CBD5E1" font-size="22" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Algorithm Research · AI Systems · Full-Stack Engineering</text>
  <text x="80" y="250" fill="#94A3B8" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">research / train / evaluate / build / ship</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5">
    <rect x="78" y="302" width="166" height="38" rx="19" fill="#7C3AED" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.62"/>
    <text x="161" y="326" text-anchor="middle" fill="#DDD6FE">MULTIMODAL AI</text>

    <rect x="257" y="302" width="242" height="38" rx="19" fill="#0891B2" fill-opacity="0.11" stroke="#22D3EE" stroke-opacity="0.58"/>
    <text x="378" y="326" text-anchor="middle" fill="#CFFAFE">SEARCH · ADS · RECOMMENDATION</text>

    <rect x="512" y="302" width="210" height="38" rx="19" fill="#4F46E5" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.60"/>
    <text x="617" y="326" text-anchor="middle" fill="#E0E7FF">AGENT POST-TRAINING</text>

    <rect x="735" y="302" width="220" height="38" rx="19" fill="#65A30D" fill-opacity="0.10" stroke="#A3E635" stroke-opacity="0.52"/>
    <text x="845" y="326" text-anchor="middle" fill="#ECFCCB">HARNESS ENGINEERING</text>
  </g>

  <text x="80" y="372" fill="#64748B" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.5">Research deeply · Build carefully · Ship things that work</text>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="27.5" stroke="#FFFFFF" stroke-opacity="0.06"/>
</svg>