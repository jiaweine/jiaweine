<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Current technical focus</title>
  <desc id="desc">A neutral editorial map of multimodal AI, search ads and recommendation, agent post-training and harness engineering.</desc>

  <rect x="1" y="1" width="1198" height="238" rx="18" fill="#FAFAF8" stroke="#E5E3DE"/>

  <g stroke="#C9C7C2" stroke-width="1.2" fill="none">
    <line x1="600" y1="120" x2="258" y2="70"/>
    <line x1="600" y1="120" x2="942" y2="70"/>
    <line x1="600" y1="120" x2="258" y2="171"/>
    <line x1="600" y1="120" x2="942" y2="171"/>
    <circle cx="600" cy="120" r="36" stroke="#747474" stroke-width="1.6"/>
    <circle cx="258" cy="70" r="8" fill="#FAFAF8" stroke="#747474"/>
    <circle cx="942" cy="70" r="8" fill="#FAFAF8" stroke="#747474"/>
    <circle cx="258" cy="171" r="8" fill="#FAFAF8" stroke="#747474"/>
    <circle cx="942" cy="171" r="8" fill="#FAFAF8" stroke="#747474"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="600" y="115" text-anchor="middle" fill="#303030" font-size="14" font-weight="700">STATISTICS</text>
    <text x="600" y="133" text-anchor="middle" fill="#8A8680" font-size="10" font-weight="600" letter-spacing="0.8">FOUNDATION</text>

    <text x="282" y="66" fill="#303030" font-size="17" font-weight="700">Multimodal AI</text>
