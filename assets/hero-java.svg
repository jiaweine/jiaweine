      <text x="255" y="23" text-anchor="middle" fill="#615A53" font-size="12.5" font-weight="650">Information Sciences 2026</text>
    </g>
    <text x="64" y="421" fill="#9B9289" font-size="11.5" font-weight="560" letter-spacing=".25">Researcher when the loss converges. Engineer when it doesn't.</text>
