    <text x="62" y="152" fill="#23211F" font-size="59" font-weight="780" letter-spacing="-1.5">JIAWEI WANG</text>
    <text x="64" y="190" fill="#5A5550" font-size="19" font-weight="640">Algorithm Research · AI Systems · Full-Stack Engineering</text>
    <text x="64" y="239" fill="#302D2A" font-size="24" font-weight="700">I train models, build agents,</text>
    <text x="64" y="271" fill="#302D2A" font-size="24" font-weight="700">and engineer the harness around them.</text>
    <text x="64" y="314" fill="#797169" font-size="14.5" font-weight="520">Multimodal AI · Search, Ads &amp; Recommendation · Agent Post-Training · Harness Engineering</text>
