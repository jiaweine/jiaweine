<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.48" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="50" x2="1080" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#0891B2;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.48" stop-color="#0891B2">
        <animate attributeName="stop-color" values="#0891B2;#65A30D;#0891B2" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#65A30D">
        <animate attributeName="stop-color" values="#65A30D;#7C3AED;#65A30D" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0891B2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(210 72) rotate(35) scale(360 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(1040 318) rotate(-150) scale(410 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#64748B" stroke-opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#violetGlow)"/>
  <rect width="1200" height="420" rx="28" fill="url(#cyanGlow)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <rect x="30" y="28" width="1140" height="364" rx="24" stroke="url(#accent)" stroke-opacity="0.34"/>
  <rect x="-360" y="28" width="300" height="364" fill="url(#scan)" opacity="0.9">
    <animate attributeName="x" values="-360;1260" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.9">
    <circle cx="1012" cy="108" r="92" stroke="#0891B2" stroke-opacity="0.18"/>
    <circle cx="1012" cy="108" r="62" stroke="#65A30D" stroke-opacity="0.16"/>
    <circle cx="1012" cy="108" r="30" stroke="#7C3AED" stroke-opacity="0.18"/>
    <circle cx="1012" cy="108" r="5" fill="#65A30D">
      <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1012" cy="108" r="22" fill="#0891B2" opacity="0.08" filter="url(#softGlow)"/>
  </g>

  <g stroke-linecap="round">
    <path d="M860 248C905 220 946 217 985 235C1027 254 1062 252 1118 220" stroke="url(#accent)" stroke-width="2.2" stroke-opacity="0.56"/>
    <path d="M860 276C906 250 951 248 994 269C1039 291 1078 284 1124 250" stroke="#0891B2" stroke-opacity="0.18"/>
    <circle cx="889" cy="233" r="4.5" fill="#7C3AED"/>
    <circle cx="984" cy="235" r="4.5" fill="#0891B2"/>
    <circle cx="1087" cy="235" r="4.5" fill="#65A30D"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="78" y="62" width="154" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.82" stroke="#0891B2" stroke-opacity="0.38"/>
    <circle cx="98" cy="79" r="4" fill="#65A30D">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="165" y="84" text-anchor="middle" fill="#0E7490" font-size="12.5" letter-spacing="1.7">JIAWEINE / ACTIVE</text>
  </g>

  <text x="78" y="170" fill="#0F172A" font-size="58" font-weight="750" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Jiawei Wang</text>
  <text x="80" y="216" fill="#334155" font-size="22" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Algorithm Research · AI Systems · Full-Stack Engineering</text>
  <text x="80" y="250" fill="#64748B" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">research / train / evaluate / build / ship</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5">
    <rect x="78" y="302" width="166" height="38" rx="19" fill="#EDE9FE" fill-opacity="0.9" stroke="#7C3AED" stroke-opacity="0.30"/>
    <text x="161" y="326" text-anchor="middle" fill="#5B21B6">MULTIMODAL AI</text>

    <rect x="257" y="302" width="242" height="38" rx="19" fill="#CFFAFE" fill-opacity="0.82" stroke="#0891B2" stroke-opacity="0.28"/>
    <text x="378" y="326" text-anchor="middle" fill="#155E75">SEARCH · ADS · RECOMMENDATION</text>

    <rect x="512" y="302" width="210" height="38" rx="19" fill="#E0E7FF" fill-opacity="0.86" stroke="#4F46E5" stroke-opacity="0.28"/>
    <text x="617" y="326" text-anchor="middle" fill="#3730A3">AGENT POST-TRAINING</text>

    <rect x="735" y="302" width="220" height="38" rx="19" fill="#ECFCCB" fill-opacity="0.88" stroke="#65A30D" stroke-opacity="0.28"/>
    <text x="845" y="326" text-anchor="middle" fill="#3F6212">HARNESS ENGINEERING</text>
  </g>

  <text x="80" y="372" fill="#64748B" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.5">Research deeply · Build carefully · Ship things that work</text>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="27.5" stroke="#0F172A" stroke-opacity="0.08"/>
</svg>